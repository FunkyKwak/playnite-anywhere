services:

  backend:
    build:
      context: ..
      dockerfile: PlayniteAnywhere.Backend/Dockerfile
    container_name: playnite-anywhere-backend
    ports:
      - "8080:8080"
    volumes:
      - covers_data:/app/covers
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=playnite_anywhere;Username=playnite;Password=change-me
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: playnite-anywhere-postgres
    environment:
      POSTGRES_DB: playnite_anywhere
      POSTGRES_USER: playnite
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playnite -d playnite_anywhere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  covers_data: