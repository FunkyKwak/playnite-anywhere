<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playnite Anywhere</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <header class="topbar">

        <div class="logo">
            Playnite Anywhere
        </div>

        <div class="toolbar">

            <div class="grouping">
                <label for="group-by">Regrouper par</label>

                <select id="group-by">
                    <option value="None">Aucun</option>
                    <option value="Source">Source</option>
                    <option value="Progress">Progression</option>
                    <option value="Platform">Plateforme</option>
                </select>
            </div>

            <div class="game-count" id="game-count">
                Chargement...
            </div>

        </div>

    </header>

    <main>
        <section class="games-section">

            <div class="section-header">
                <h1>Bibliothèque</h1>
            </div>

            <div id="games" class="games-container">
                <div class="loading">
                    Chargement des jeux...
                </div>
            </div>

        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
